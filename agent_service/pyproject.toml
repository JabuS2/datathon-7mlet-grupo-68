[tool.poetry]
name = "agent-service"
version = "0.1.0"
description = "LangChain deep agent exposed over the AG-UI protocol for the admin dashboard assistant"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }

deepagents = "^0.6.12"
langchain-openai = "^1.3.0"
langchain-mcp-adapters = "^0.3.0"
ag-ui-langgraph = "^0.0.42"

PyJWT = { version = "^2.9.0", extras = ["crypto"] }
pydantic = "^2.9.0"
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^1.4.0"
httpx = "^0.27.0"

[tool.poetry.group.lint.dependencies]
ruff = "^0.6.0"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
