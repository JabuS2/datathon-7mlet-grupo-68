name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api_service

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: api_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/api_service_test
      USE_TESTCONTAINERS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('api_service/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Type check (mypy)
        run: poetry run mypy .

      - name: Run tests (pytest)
        run: poetry run pytest -v --disable-warnings --maxfail=1

  model-service-tests:
    # O model_service passou a ter banco (governança) e migrações próprias; até aqui não
    # tinha CI nenhum — os 4 arquivos de teste nunca rodavam.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: model_service

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: model_service
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MODEL_DATABASE_URL: postgresql://test:test@localhost:5433/model_service
      REDIS_HOST: localhost
      REDIS_PORT: "6380"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-model-${{ runner.os }}-${{ hashFiles('model_service/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Type check (mypy)
        run: poetry run mypy .

      # Falha se alguém mudar os models e esquecer a migração.
      - name: Migrations apply cleanly
        run: poetry run alembic upgrade head

      - name: Run tests (pytest)
        run: poetry run pytest -v --disable-warnings

      # Gate de propriedades: elegibilidade e invariância de fairness contra o golden set.
      # Não precisa de Postgres/Redis/HTTP — roda o BanditService com store em memória.
      - name: Offline evaluation (golden set)
        run: poetry run python ../scripts/run_evaluation.py

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/evaluation-report.md

  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front_service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --coverage --watch=false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: front_service/coverage

  notebooks:
    # Smoke test: executa os três notebooks de análise ponta a ponta e descarta a
    # saída. Eles leem só `data/golden_set/` (versionado, 680 KB), então não
    # dependem do Kaggle nem de nenhum serviço no ar. ~30s no total.
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: notebooks/requirements.txt

      - name: Install dependencies
        run: pip install -r notebooks/requirements.txt

      # --output-dir aponta para fora do repo: os notebooks executados nunca
      # substituem os versionados.
      - name: Execute notebooks
        run: |
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --execute --to notebook --output-dir /tmp/nbout "$nb"
            echo "::endgroup::"
          done
