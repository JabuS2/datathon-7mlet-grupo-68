services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    image: datathon-mab-api
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - mlflow
    networks:
      - backend
    ports:
      - "8001:8000"

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
    image: datathon-mab-dashboard
    env_file:
      - .env
    environment:
      VITE_API_URL: http://api:8000
    depends_on:
      - api
    networks:
      - backend
    expose:
      - "8501"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root /mlruns
    env_file:
      - .env
    volumes:
      - mlruns:/mlruns
    depends_on:
      - postgres
    networks:
      - backend
    expose:
      - "5000"

  postgres:
    image: postgres:16
    container_name: datathon-mab-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  mlruns:
  postgres_data:

networks:
  backend:
    driver: bridge