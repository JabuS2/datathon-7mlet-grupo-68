  # ── Usage ─────────────────────────────────────────────────
  # Infra only (run API locally):  docker-compose up -d
  # Infra + API in Docker:         docker-compose --profile api up -d
  # ──────────────────────────────────────────────────────────

name: datathon-7mlet-grupo-68

services:
  api:
    container_name: hp-invest-backend
    profiles: ["api"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - .env
    environment:
      # Override localhost defaults from .env with Docker service names
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Allow both the Angular frontend (4200) and the Next.js dashboard (3000)
      BACKEND_CORS_ORIGINS: '["http://localhost:4200","http://localhost:3000"]'
      # Seed the DB (admin + fake users) on startup; set to "false" to skip
      SEED_DB: ${SEED_DB:-true}
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - backend
    ports:
      - "8001:8000"

  # ── Admin Assistant stack (opt-in: --profile app) ──────────
  mcp_server:
    container_name: admin-assistant-mcp-server
    profiles: ["app"]
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    environment:
      PORT: "8200"
      MCP_HTTP_PATH: /mcp
      API_SERVICE_URL: http://api:8000
    depends_on:
      - api
    networks:
      - backend
    ports:
      - "8200:8200"

  agent_service:
    container_name: admin-assistant-backend
    profiles: ["app"]
    build:
      context: ./agent_service
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8100"
      AGENT_NAME: ${AGENT_NAME}
      AGENT_PATH: /
      CORS_ORIGINS: ${AGENT_CORS_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      MCP_SERVER_URL: http://mcp_server:8200/mcp
      DOWNSTREAM_API_TOKEN: ${DOWNSTREAM_API_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      REQUIRE_AUTH: "true"
    depends_on:
      - mcp_server
    networks:
      - backend
    ports:
      - "8100:8100"

  dashboard:
    container_name: admin-assistant-frontend
    profiles: ["app"]
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_SERVICE_URL: ${NEXT_PUBLIC_API_SERVICE_URL}
        NEXT_PUBLIC_AGENT_NAME: ${AGENT_NAME}
    environment:
      AGENT_SERVICE_URL: http://agent_service:8100/
      NEXT_PUBLIC_API_SERVICE_URL: ${NEXT_PUBLIC_API_SERVICE_URL}
      NEXT_PUBLIC_AGENT_NAME: ${AGENT_NAME}
    depends_on:
      - agent_service
    networks:
      - backend
    ports:
      - "3000:3000"

  # ── Angular frontend (opt-in: --profile app) ───────────────
  front_service:
    container_name: hp-invest-frontend
    profiles: ["app"]
    build:
      context: ./front_service
      dockerfile: Dockerfile
    depends_on:
      - api
    networks:
      - backend
    ports:
      - "4200:80"

  # ── Relational Database ────────────────────────────────────
  postgres:
    container_name: hp-invest-postgres
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      - postgres
    networks:
      - backend
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Cache / Queue ──────────────────────────────────────────
  redis:
    container_name: hp-invest-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


