services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    image: datathon-mab-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
    depends_on:
      - mlflow

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
    image: datathon-mab-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      VITE_API_URL: http://api:8001
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlruns

  postgres:
      image: postgres:16
      container_name: datathon-mab-postgres
      restart: unless-stopped
      environment:
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
volumes:
  mlruns:
  postgres_data:
