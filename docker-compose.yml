# ── Usage ─────────────────────────────────────────────────
# Infra only (run API locally):  docker-compose up -d
# Infra + API in Docker:         docker-compose --profile api up -d
# ──────────────────────────────────────────────────────────

name: datathon-7mlet-grupo-68

services:
  api:
    container_name: hp-invest-backend
    profiles: ["api"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - .env
    environment:
      # Override localhost defaults from .env with Docker service names
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Allow both the Angular frontend (4200) and the Next.js dashboard (3000)
      BACKEND_CORS_ORIGINS: '["http://localhost:4200","http://localhost:3000"]'
      # Seed the DB (admin + fake users) on startup; set to "false" to skip
      SEED_DB: ${SEED_DB:-true}
      # O default de settings.py resolve <pacote>/../data, que no container vira /data —
      # mas o volume monta em /app/data. Sem isto o seed do golden set não acha o catálogo.
      DATA_DIR: /app/data
      MODEL_SERVICE_URL: http://model:8000
      # Datadog (tracing desligado por default; ligue com DD_TRACE_ENABLED=true no .env)
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: api
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "api"}]'
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
      - model
    networks:
      - backend
    ports:
      - "8001:8000"

  # ── Model Service (bandits) ────────────────────────────────
  model:
    profiles: ["api"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.model
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CATALOG_PATH: /app/data/golden_set/offer_catalog.json
      CLIENTS_CSV_PATH: /app/data/golden_set/golden_clients.csv
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: datathon-mab
      # Banco PRÓPRIO de governança (cadeia Alembic separada da do api_service)
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      MODEL_POSTGRES_DB: ${MODEL_POSTGRES_DB:-model_service}
      # Datadog
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: model
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "model"}]'
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
      - mlflow
    networks:
      - backend
    ports:
      - "8002:8000"

  # ── Admin Assistant stack (opt-in: --profile app) ──────────
  mcp_server:
    container_name: admin-assistant-mcp-server
    profiles: ["app"]
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    environment:
      PORT: "8200"
      MCP_HTTP_PATH: /mcp
      API_SERVICE_URL: http://api:8000
      # Text-to-SQL widget: direct, SELECT-only access to both Postgres databases.
      # Empty READONLY_DB_PASSWORD (unset in .env) leaves this blank; the tools no-op if so.
      READONLY_DATABASE_URL: postgresql://${READONLY_DB_USER:-readonly_reporting}:${READONLY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      READONLY_MODEL_DATABASE_URL: postgresql://${READONLY_DB_USER:-readonly_reporting}:${READONLY_DB_PASSWORD}@postgres:5432/${MODEL_POSTGRES_DB:-model_service}
    depends_on:
      - api
      - postgres
    networks:
      - backend
    ports:
      - "8200:8200"

  agent_service:
    container_name: admin-assistant-backend
    profiles: ["app"]
    build:
      context: ./agent_service
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8100"
      AGENT_NAME: ${AGENT_NAME}
      AGENT_PATH: /
      CORS_ORIGINS: ${AGENT_CORS_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      MCP_SERVER_URL: http://mcp_server:8200/mcp
      DOWNSTREAM_API_TOKEN: ${DOWNSTREAM_API_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      REQUIRE_AUTH: "true"
    depends_on:
      - mcp_server
    networks:
      - backend
    ports:
      - "8100:8100"

  dashboard:
    container_name: admin-assistant-frontend
    profiles: ["app"]
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_SERVICE_URL: ${NEXT_PUBLIC_API_SERVICE_URL}
        NEXT_PUBLIC_AGENT_NAME: ${AGENT_NAME}
    environment:
      AGENT_SERVICE_URL: http://agent_service:8100/
      NEXT_PUBLIC_API_SERVICE_URL: ${NEXT_PUBLIC_API_SERVICE_URL}
      NEXT_PUBLIC_AGENT_NAME: ${AGENT_NAME}
    depends_on:
      - agent_service
    networks:
      - backend
    ports:
      - "3000:3000"

  # ── Angular frontend (opt-in: --profile app) ───────────────
  front_service:
    container_name: hp-invest-frontend
    profiles: ["app"]
    build:
      context: ./front_service
      dockerfile: Dockerfile
    depends_on:
      - api
    networks:
      - backend
    ports:
      - "4200:80"

  # ── Relational Database ────────────────────────────────────
  postgres:
    container_name: hp-invest-postgres
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # lido pelo script em initdb/ para criar o database do model_service
      MODEL_POSTGRES_DB: ${MODEL_POSTGRES_DB:-model_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # cria o database do model_service na primeira subida do volume
      - ./infra/docker/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      - postgres
    networks:
      - backend
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Cache / Queue ──────────────────────────────────────────
  redis:
    container_name: hp-invest-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MLflow Tracking + Model Registry ───────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    profiles: ["api"]
    restart: unless-stopped
    # backend SQLite + serve-artifacts: o servidor proxia os artefatos, então o
    # model_service (cliente) não precisa compartilhar o volume de artefatos.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --artifacts-destination /mlruns
      --serve-artifacts
    volumes:
      - mlruns:/mlruns
    networks:
      - backend
    ports:
      - "5000:5000"

  # ── Datadog Agent (observabilidade: logs + APM) ────────────
  # Habilite com: docker-compose --profile api --profile datadog up -d
  # Requer DD_API_KEY no .env (ver docs/observability-datadog.md).
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    profiles: ["datadog"]
    restart: unless-stopped
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-dev}
      # coleta de logs de todos os containers
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
      # APM (traces do ddtrace nas apps)
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_CONTAINER_EXCLUDE_LOGS: "name:dd-agent name:portainer name:postgres name:ryuk name:redis redis"
    volumes:
      # Coleta de logs de containers precisa apenas do socket do Docker —
      # funciona no Docker Desktop (Windows/Mac) e em host Linux.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mounts opcionais para métricas de infra do HOST (somente host Linux;
      # descomente apenas nesse caso — no Docker Desktop podem falhar):
      # - /proc/:/host/proc/:ro
      # - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    networks:
      - backend
    ports:
      - "8126:8126" # APM trace intake

