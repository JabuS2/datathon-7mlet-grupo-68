  # ── Usage ─────────────────────────────────────────────────
  # Infra only (run API locally):  docker-compose up -d
  # Infra + API in Docker:         docker-compose --profile api up -d
  # ──────────────────────────────────────────────────────────

name: datathon-7mlet-grupo-68

services:
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - .env
    environment:
      # Override localhost defaults from .env with Docker service names
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MODEL_SERVICE_URL: http://model:8000
      # Datadog (tracing desligado por default; ligue com DD_TRACE_ENABLED=true no .env)
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: api
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "api"}]'
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
      - opensearch
      - neo4j
      - model
    networks:
      - backend
    ports:
      - "8001:8000"

  # ── Model Service (bandits) ────────────────────────────────
  model:
    profiles: ["api"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.model
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CATALOG_PATH: /app/data/golden_set/offer_catalog.json
      CLIENTS_CSV_PATH: /app/data/golden_set/golden_clients.csv
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: datathon-mab
      # Datadog
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: model
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "model"}]'
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - mlflow
    networks:
      - backend
    ports:
      - "8002:8000"

  # ── Relational Database ────────────────────────────────────
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      - postgres
    networks:
      - backend
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Cache / Queue ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Search Engine ──────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
      DISABLE_SECURITY_PLUGIN: "false"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - backend
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200/_cluster/health -u admin:${OPENSEARCH_ADMIN_PASSWORD} | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
    depends_on:
      - opensearch
    networks:
      - backend
    ports:
      - "5601:5601"

  # ── Graph Database ─────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - backend
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5


  # ── MLflow Tracking + Model Registry ───────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    profiles: ["api"]
    restart: unless-stopped
    # backend SQLite + serve-artifacts: o servidor proxia os artefatos, então o
    # model_service (cliente) não precisa compartilhar o volume de artefatos.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --artifacts-destination /mlruns
      --serve-artifacts
    volumes:
      - mlruns:/mlruns
    networks:
      - backend
    ports:
      - "5000:5000"

  # ── Datadog Agent (observabilidade: logs + APM) ────────────
  # Habilite com: docker-compose --profile api --profile datadog up -d
  # Requer DD_API_KEY no .env (ver docs/observability-datadog.md).
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    profiles: ["datadog"]
    restart: unless-stopped
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-dev}
      # coleta de logs de todos os containers
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
      # APM (traces do ddtrace nas apps)
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
    volumes:
      # Coleta de logs de containers precisa apenas do socket do Docker —
      # funciona no Docker Desktop (Windows/Mac) e em host Linux.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mounts opcionais para métricas de infra do HOST (somente host Linux;
      # descomente apenas nesse caso — no Docker Desktop podem falhar):
      # - /proc/:/host/proc/:ro
      # - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    networks:
      - backend
    ports:
      - "8126:8126"   # APM trace intake


