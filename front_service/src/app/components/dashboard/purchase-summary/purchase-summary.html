<div class="bg-white border border-gray-200 rounded-lg p-6 h-full">
  <h3 class="text-xl font-semibold border-b border-gray-200 pb-3 mb-6">Resumo de Compras</h3>

  <div class="flex flex-col gap-6">
    @for (category of categories; track category.name) {
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-500">
            {{ category.name }}
          </span>

          <span class="font-mono font-semibold text-black">
            {{ category.value }}
          </span>
        </div>

        <div class="w-full h-2 rounded-full bg-gray-100 overflow-hidden">
          <div
            class="h-full rounded-full bg-black transition-all duration-300"
            [style.width.%]="category.percentage"
          ></div>
        </div>
      </div>
    }
  </div>
</div>
