@if (profile(); as profile) {
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-8">
    <!-- Saldo -->
    <div
      class="lg:col-span-2 bg-white border border-gray-200 rounded-lg p-6 hover:shadow-lg transition"
    >
      <p class="uppercase text-xs tracking-wider text-gray-500">Saldo Total</p>

      <div class="flex flex-wrap items-end gap-4 mt-4">
        <h2 class="text-5xl font-bold">R$ {{ profile.saldoFicticio | number: '1.2-2' }}</h2>
      </div>
    </div>

    <!-- Relacionamento -->
    <div class="bg-white border border-gray-200 rounded-lg p-6 hover:shadow-lg transition">
      <p class="uppercase text-xs tracking-wider text-gray-500">Relacionamento</p>

      <div class="flex flex-wrap items-end gap-4 mt-4">
        <h2 class="text-5xl font-bold">{{ profile.tempoRelacionamentoMeses }} meses</h2>
      </div>
    </div>
  </div>
}
