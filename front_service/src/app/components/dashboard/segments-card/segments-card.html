<div class="bg-white border border-gray-200 rounded-lg p-6">
  <h3 class="text-xl font-semibold mb-5">Segmentos Sintéticos</h3>

  <div class="flex flex-wrap gap-3">
    @for (segment of segments; track segment) {
      <span
        class="px-4 py-2 rounded-full border border-gray-300 bg-gray-100 text-sm uppercase tracking-wide"
      >
        {{ segment }}
      </span>
    }
  </div>
</div>
