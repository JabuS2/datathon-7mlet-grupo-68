<section>
  <div class="flex justify-between items-center mb-4 border-b border-gray-200 pb-4">
    <h2 class="text-xl font-semibold text-black">Lançamentos Futuros</h2>
  </div>

  <div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-gray-200 bg-[#f9f9f9]">
            <th class="py-4 px-6 text-xs text-gray-600 font-medium">Data Prevista</th>

            <th class="py-4 px-6 text-xs text-gray-600 font-medium">Descrição</th>

            <th class="py-4 px-6 text-xs text-gray-600 font-medium">Status</th>

            <th class="py-4 px-6 text-xs text-gray-600 font-medium text-right">Valor</th>
          </tr>
        </thead>

        <tbody class="text-sm font-mono">
          @for (transaction of transactions; track transaction.date + transaction.description) {
            <tr class="border-b border-gray-200 last:border-b-0 hover:bg-gray-50 transition-colors">
              <td class="py-4 px-6">
                {{ transaction.date }}
              </td>

              <td class="py-4 px-6">
                <div class="flex items-center gap-3">
                  <span class="material-symbols-outlined text-gray-600">
                    {{ transaction.icon }}
                  </span>

                  <span class="font-medium font-sans text-black">
                    {{ transaction.description }}
                  </span>
                </div>
              </td>

              <td class="py-4 px-6">
                <span
                  class="inline-block px-2 py-1 bg-gray-100 text-gray-600 rounded text-[10px] font-semibold uppercase tracking-wider border border-gray-200"
                >
                  {{ transaction.status }}
                </span>
              </td>

              <td class="py-4 px-6 text-right">- {{ transaction.value }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</section>
