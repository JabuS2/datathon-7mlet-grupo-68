@if (profile(); as profile) {
  <div class="h-full bg-white border border-gray-200 rounded-lg p-6">
    <h3 class="text-xl font-semibold border-b border-gray-200 pb-3 mb-4">Perfil</h3>

    <div class="space-y-4">
      <div class="flex justify-between">
        <span class="text-gray-500"> Idade </span>

        <span class="font-medium">{{ profile.idade }} anos </span>
      </div>

      <div class="flex justify-between pt-4 border-t border-gray-100">
        <span class="text-gray-500"> Estado </span>

        <span class="font-medium"> {{ profile.estado }} </span>
      </div>

      <div class="flex justify-between pt-4 border-t border-gray-100">
        <span class="text-gray-500"> Origem </span>

        <span class="font-medium"> {{ profile.origem }} </span>
      </div>
    </div>
  </div>
}
