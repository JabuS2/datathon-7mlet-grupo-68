apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datathon-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datathon-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "datathon-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "datathon-api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Non-sensitive config from ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "datathon-api.fullname" . }}-config

          # Sensitive values from Secrets
          env:
            # PostgreSQL
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres }}
                  key: POSTGRES_DB
            # Redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.redis }}
                  key: REDIS_PASSWORD
            # OpenSearch
            - name: OPENSEARCH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.opensearch }}
                  key: OPENSEARCH_USER
            - name: OPENSEARCH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.opensearch }}
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            # Neo4j
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.neo4j }}
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.neo4j }}
                  key: NEO4J_PASSWORD
            # App secrets
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.app }}
                  key: SECRET_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.app }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.app }}
                  key: OPENAI_API_KEY
                  optional: true

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
