[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datathon-7mlet-grupo-68"
version = "0.1.0"
description = "Plataforma de experimentação adaptativa com Multi-Armed Bandit para recomendação de produtos financeiros (dataset Santander)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi[standard] (>=0.136.3,<0.137.0)",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.33",
    "typer>=0.12",
    "pydantic>=2.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyarrow>=14.0",
    "chromadb>=1.0",
    "mlflow>=3.0",
    "chromadb>=0.4",
    "mlflow>=2.12",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "psycopg-binary (>=3.3.4,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.4",
    "mypy>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
