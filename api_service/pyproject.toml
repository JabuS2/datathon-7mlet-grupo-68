[tool.poetry]
name = "datathon-7mlet-grupo-68"
version = "0.1.0"
description = "API service para plataforma de experimentação adaptativa"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

# API core
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }

# DB / ORM
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"

asyncpg = "^0.29.0"
psycopg = { version = "^3.2.0", extras = ["binary"] }

# Auth / Security
python-jose = { version = "^3.4.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }

# Config
pydantic = "^2.9.0"
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.1"
psycopg2-binary = "^2.9.12"
polyfactory = "^3.3.0"
argon2-cffi = "^25.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"

ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"