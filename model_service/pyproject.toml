[tool.poetry]
name = "datathon-7mlet-grupo-68-model"
version = "0.1.0"
description = "Model service (bandits) para plataforma de recomendacao adaptativa"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }

pydantic = "^2.9.0"
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.1"

numpy = "^2.1.0"
pandas = "^2.2.0"
redis = "^5.0.0"
mlflow = "^2.12.1"
ddtrace = "^2.9.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
httpx = "^0.27.0"
fakeredis = { version = "^2.23.0", extras = ["lua"] }

[tool.poetry.group.lint.dependencies]
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
